# catalogue/config.yaml
#
# This file is the single source of truth for what garment styles the
# catalogue tools know about. Add a new style by adding a new block under
# `styles:` - no Python code changes needed in generate.py or review.py.
#
# ---------------------------------------------------------------------------
# HOW TO ADD A NEW STYLE
# ---------------------------------------------------------------------------
# 1. Take one clean photo of the garment on a plain background (front view,
#    full garment visible, no person's face) and save it under
#    catalogue/templates/<id>.jpg - the filename must match `template` below.
# 2. Copy one of the blocks below and edit id, name, department,
#    fabric_prefixes, tryon_plan and the prompt text.
# 3. Save this file and run generate.py again.
#
# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
# id                - short unique code, used in filenames. Letters/digits/
#                     underscores only.
# name              - what customers see on the kiosk screen.
# department        - one of: suiting, shirting, ethnic. Picks which fal.ai
#                     model generates this style's images (see `models:`
#                     below) and which fabric photos it can use.
# fabric_prefixes   - which fabric-code prefixes this style accepts. Fabric
#                     photos live in catalogue/fabrics/ and are named
#                     <PREFIX>-<number>.jpg, e.g. SU-01.jpg. A style with
#                     fabric_prefixes: [SU] only ever gets matched against
#                     fabrics named SU-*.
# template          - path (relative to the repo root) to that one clean
#                     reference photo of the garment. Only used when
#                     tryon_plan is a single string (see below) - a
#                     multi-piece style uses `pieces` instead.
# prompt            - the exact instruction sent to the image-editing model,
#                     along with the template photo and the fabric swatch
#                     photo. Keep the closing sentence (plain background,
#                     front view, etc.) in every style's prompt - it's what
#                     keeps catalogue photos looking consistent with each
#                     other on the kiosk screen. Only used when tryon_plan
#                     is a single string, same as `template`.
# tryon_plan        - how the KIOSK should apply this style during a live
#                     try-on (Stage 2, backend/). Either a single category
#                     ("tops", "bottoms", or "one-pieces") - use `template`/
#                     `prompt` above for these - or a list of categories run
#                     as separate passes, e.g. [bottoms, tops] for a suit -
#                     use `pieces` below for these instead.
# pieces            - REQUIRED when tryon_plan is a list instead of a single
#                     string. A mapping from each tryon_plan category to its
#                     OWN template + prompt, e.g.:
#                       pieces:
#                         bottoms: {template: ..., prompt: ...}
#                         tops: {template: ..., prompt: ...}
#                     Each piece is generated as its own separate catalogue
#                     image. Don't use one combined "whole outfit" photo as
#                     if it were a single piece - the backend runs each pass
#                     with no masking, so if the "bottoms" pass's reference
#                     image also shows a jacket, the model gets confused
#                     about what to extract and bleeds jacket-like shapes
#                     into the trousers (confirmed in testing, 2026-09-22:
#                     exactly this, with a combined two-piece-suit photo
#                     used for both passes). Take a separate clean photo of
#                     each individual piece instead.
#
#                     UPDATE 2026-09-22: even with separate clean photos per
#                     piece, running two tryon_plan passes sequentially is
#                     still unreliable - whichever pass runs SECOND (an
#                     overlay on an image the model has already modified
#                     once) can lose its category's correct shape: with
#                     [bottoms, tops] the jacket sometimes loses its sleeves
#                     (renders short-sleeved); reordered to [tops, bottoms]
#                     the trousers sometimes render as a skirt instead of
#                     separate legs. Neither order is reliable yet - see
#                     `enabled` below. This looks like a maskless
#                     segmentation-free limitation of sequential multi-pass
#                     compositing itself, not a catalogue-image quality
#                     issue - prompt changes alone didn't fix it.
# enabled           - optional, defaults to true. Set to false to keep a
#                     style out of the live kiosk (hidden from customers)
#                     while still letting generate.py/review.py produce and
#                     approve its catalogue images normally - useful for a
#                     style with a known quality problem, like the
#                     multi-piece sequential-pass issue above.
# ---------------------------------------------------------------------------

# Which fal.ai image-editing model generates each department's images, and
# roughly what each generated image costs (used only to estimate cost
# before a run starts - see catalogue/README.md for how to check the real,
# current price on fal.ai's pricing pages, since fal can change pricing).
models:
  suiting:
    endpoint: fal-ai/flux-2-pro/edit
    approx_cost_usd: 0.05
  shirting:
    endpoint: fal-ai/flux-2-pro/edit
    approx_cost_usd: 0.05
  ethnic:
    endpoint: fal-ai/nano-banana-2/edit
    approx_cost_usd: 0.08

styles:
  - id: two_piece_suit
    name: "Two-Piece Suit"
    department: suiting
    fabric_prefixes: [SU]
    tryon_plan: [bottoms, tops]
    # Disabled 2026-09-22: sequential 2-pass compositing is unreliable for
    # this style regardless of pass order (see the UPDATE note above `pieces`
    # near the top of this file). Re-enable once a reliable approach is found.
    enabled: false
    pieces:
      tops:
        template: catalogue/templates/two_piece_suit_jacket.jpg
        prompt: >
          Recreate this exact template garment - a single-breasted suit
          jacket with notch lapels, a standard button closure, welt chest
          pocket and flap side pockets - keeping the identical cut, lapel
          shape, buttons and overall silhouette. Remake it entirely in the
          fabric shown in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against a plain light-grey studio
          background, front view, full garment visible, no person, no
          mannequin head. Show only the jacket - no trousers, no other
          garment.
      bottoms:
        template: catalogue/templates/two_piece_suit_trousers.jpg
        prompt: >
          Recreate this exact template garment - flat-front suit trousers
          with a straight leg and matching waistband - keeping the
          identical cut and overall silhouette. Remake it entirely in the
          fabric shown in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against a plain light-grey studio
          background, front view, full garment visible, no person, no
          mannequin head. Show only the trousers - no jacket, no other
          garment.

  - id: three_piece_suit
    name: "Three-Piece Suit"
    department: suiting
    fabric_prefixes: [SU]
    tryon_plan: [bottoms, tops]
    # Disabled 2026-09-22: same sequential 2-pass reliability issue as
    # two_piece_suit above - not yet generated, kept disabled by default.
    enabled: false
    pieces:
      tops:
        template: catalogue/templates/three_piece_suit_jacket_waistcoat.jpg
        prompt: >
          Recreate this exact template garment - a single-breasted jacket
          with notch lapels worn over a matching single-breasted waistcoat
          with a V-neck opening and five buttons - keeping the identical
          cut, lapel shape, buttons and overall silhouette of both pieces.
          Remake it entirely in the fabric shown in the second (swatch)
          image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against a
          plain light-grey studio background, front view, full garment
          visible, no person, no mannequin head. Show only the jacket and
          waistcoat - no trousers, no other garment.
      bottoms:
        template: catalogue/templates/three_piece_suit_trousers.jpg
        prompt: >
          Recreate this exact template garment - flat-front suit trousers
          with a straight leg and matching waistband - keeping the
          identical cut and overall silhouette. Remake it entirely in the
          fabric shown in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against a plain light-grey studio
          background, front view, full garment visible, no person, no
          mannequin head. Show only the trousers - no jacket, no other
          garment.

  - id: blazer
    name: "Blazer"
    department: suiting
    fabric_prefixes: [SU]
    template: catalogue/templates/blazer.jpg
    tryon_plan: tops
    prompt: >
      Recreate this exact template garment - a single-breasted blazer with
      notch lapels, a two-button closure, welt chest pocket and flap side
      pockets - keeping the identical cut, lapel shape, buttons and overall
      silhouette. Remake it entirely in the fabric shown in the second
      (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against a plain light-grey
      studio background, front view, full garment visible, no person, no
      mannequin head.

  - id: formal_shirt
    name: "Formal Shirt"
    department: shirting
    fabric_prefixes: [SH]
    template: catalogue/templates/formal_shirt.jpg
    tryon_plan: tops
    prompt: >
      Recreate this exact template garment - a formal button-down shirt with
      a classic spread collar, a full button placket down the front and
      buttoned barrel cuffs - keeping the identical cut, collar shape,
      buttons and overall silhouette. Remake it entirely in the fabric shown
      in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against
      a plain light-grey studio background, front view, full garment
      visible, no person, no mannequin head.

  - id: mandarin_collar_shirt
    name: "Mandarin-Collar Shirt"
    department: shirting
    fabric_prefixes: [SH]
    template: catalogue/templates/mandarin_collar_shirt.jpg
    tryon_plan: tops
    prompt: >
      Recreate this exact template garment - a shirt with a short standing
      mandarin (band) collar, a full button placket down the front and
      buttoned barrel cuffs - keeping the identical cut, collar shape,
      buttons and overall silhouette. Remake it entirely in the fabric shown
      in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against
      a plain light-grey studio background, front view, full garment
      visible, no person, no mannequin head.

  - id: kurta
    name: "Kurta"
    department: ethnic
    fabric_prefixes: [ET]
    template: catalogue/templates/kurta.jpg
    tryon_plan: tops
    prompt: >
      Recreate this exact template garment - a straight-cut kurta falling to
      around knee length, with a short mandarin/band collar, a button
      placket at the neck and long sleeves - keeping the identical cut,
      collar shape, buttons and overall silhouette. Remake it entirely in
      the fabric shown in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern.
      Photograph it against a plain light-grey studio background, front
      view, full garment visible, no person, no mannequin head.

  - id: sherwani
    name: "Sherwani"
    department: ethnic
    fabric_prefixes: [ET]
    template: catalogue/templates/sherwani.jpg
    tryon_plan: tops
    prompt: >
      Recreate this exact template garment - a long, knee-length sherwani
      coat with a mandarin collar, a full button-front closure down the
      centre and a fitted silhouette - keeping the identical cut, collar
      shape, buttons and overall silhouette. Remake it entirely in the
      fabric shown in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it
      against a plain light-grey studio background, front view, full
      garment visible, no person, no mannequin head.

  - id: bandhgala
    name: "Bandhgala"
    department: ethnic
    fabric_prefixes: [ET]
    template: catalogue/templates/bandhgala.jpg
    tryon_plan: tops
    prompt: >
      Recreate this exact template garment - a bandhgala (Jodhpuri) jacket:
      a short, fitted, single-breasted coat with a mandarin collar and a
      concealed or top-fastened button placket closed to the neck - keeping
      the identical cut, collar shape, buttons and overall silhouette.
      Remake it entirely in the fabric shown in the second (swatch) image:
      reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against a plain light-grey studio
      background, front view, full garment visible, no person, no mannequin
      head.

  - id: nehru_jacket
    name: "Nehru Jacket"
    department: ethnic
    fabric_prefixes: [ET]
    template: catalogue/templates/nehru_jacket.jpg
    tryon_plan: tops
    prompt: >
      Recreate this exact template garment - a short, sleeveless-or-fitted
      Nehru jacket falling to around hip length, with a mandarin collar and
      a straight button-front closure to the neck - keeping the identical
      cut, collar shape, buttons and overall silhouette. Remake it entirely
      in the fabric shown in the second (swatch) image: reproduce that fabric's exact colour and shade as shown in the swatch - do not lighten a dark fabric, and do not add a check, plaid, windowpane or diamond pattern unless the swatch itself clearly shows one; if the swatch is a plain solid colour, render a plain solid colour with only its natural weave texture, no invented pattern. Photograph it against a plain light-grey studio background,
      front view, full garment visible, no person, no mannequin head.
